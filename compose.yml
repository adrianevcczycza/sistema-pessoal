services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meuespaco
      POSTGRES_USER: meuespaco
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD no .env}
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuespaco"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/meuespaco
      DATABASE_USER: meuespaco
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  database:
