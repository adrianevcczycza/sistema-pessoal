server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:lax}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meuespaco}
    username: ${DATABASE_USER:meuespaco}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    jdbc:
      initialize-schema: never
app:
  origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  initial-password: ${INITIAL_PASSWORD:}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  exchange-url: ${EXCHANGE_URL:}
  news-url: ${NEWS_RSS_URL:}
logging:
  level:
    root: INFO
    org.springframework.jdbc: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    software.amazon.awssdk: WARN
